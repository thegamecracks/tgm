name: Run tests

on:
  push:
    paths:
      - 'tests/'
      - '**.py'
      - 'pyproject.toml'
      - 'uv.lock'
  pull_request:
    paths:
      - 'tests/'
      - '**.py'
      - 'pyproject.toml'
      - 'uv.lock'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.1
      - run: uv sync --locked --all-extras --dev
      - run: uv run -m pytest
